name: Prerelease pipeline
on:
  release:
    types:
      - prereleased
    tags:
      - 'v*'


permissions:
  contents: write

jobs:
  pre-release:
    if: ${{ !contains(github.event.release.body, 'release-flow=batch') }}
    uses: newrelic/coreint-automation/.github/workflows/reusable_pre_release.yaml@v3
    with:
      tag: ${{ github.event.release.tag_name }}
      integration: "nginx"
      upload_fips_packages: true
    secrets: inherit
